<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FSCSS Compiler v2.0</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary: #4361ee;
      --primary-dark: #3f37c9;
      --secondary: #7209b7;
      --accent: #f72585;
      --dark: #1e293b;
      --darker: #0f172a;
      --light: #f8fafc;
      --gray: #64748b;
      --light-gray: #e2e8f0;
      --border: #334155;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      --shadow-md: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
      --radius: 8px;
      --transition: all 0.3s ease;
      
      /* Light theme variables */
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #1e293b;
      --editor-bg: #ffffff;
      --editor-text: #1e293b;
      --border-color: #e2e8f0;
      --log-bg: #ffffff;
      --log-text: #1e293b;
    }

    .dark-theme {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --editor-bg: #1a1f2d;
      --editor-text: #e2e8f0;
      --border-color: #334155;
      --log-bg: #1a2530;
      --log-text: #e2e8f0;
    }
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      line-height: 1.6;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      transition: var(--transition);
    }
    
    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 20px;
    }
    
    header {
      text-align: center;
      margin-bottom: 25px;
      padding: 15px;
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      position: relative;
    }
    
    .header-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
    }
    
    h1 {
      font-size: 2.5rem;
      color: var(--primary);
      margin-bottom: 5px;
    }
    
    .subtitle {
      color: var(--gray);
      font-size: 1.1rem;
      max-width: 600px;
    }
    
    .theme-toggle {
      position: absolute;
      top: 20px;
      right: 20px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 50px;
      padding: 8px 15px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: var(--transition);
    }
    
    .theme-toggle:hover {
      border-color: var(--primary);
    }
    
    .panel {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      margin-bottom: 25px;
    }
    
    .editor-container {
      flex: 1;
      min-width: 300px;
      background: var(--card-bg);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow-md);
      transition: var(--transition);
      position: relative;
    }
    
    .panel-header {
      background: rgba(0, 0, 0, 0.1);
      padding: 12px 15px;
      font-weight: 600;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
    }
    
    .editor-box {
      height: 40vh;
      background: var(--editor-bg);
      color: var(--editor-text);
      padding: 15px;
      width: 100%;
      border: none;
      resize: none;
      font-family: 'Fira Code', 'Consolas', monospace;
      font-size: 14px;
      line-height: 1.5;
      overflow: auto;
      tab-size: 2;
      transition: var(--transition);
    }
    
    .editor-box:focus {
      outline: 2px solid var(--primary);
    }
    
    .output-container {
      position: relative;
    }
    
    #cssBox {
      white-space: pre;
      overflow: auto;
    }
    
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      margin-bottom: 25px;
      justify-content: center;
    }
    
    .btn {
      background: var(--primary);
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 50px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: var(--shadow);
    }
    
    .btn:hover {
      background: var(--primary-dark);
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
    }
    
    .btn:active {
      transform: translateY(0);
    }
    
    .btn-danger {
      background: var(--danger);
    }
    
    .btn-danger:hover {
      background: #c0392b;
    }
    
    .btn-success {
      background: var(--success);
    }
    
    .btn-success:hover {
      background: #27ae60;
    }
    
    .btn-secondary {
      background: var(--secondary);
    }
    
    .btn-secondary:hover {
      background: #5e0c9d;
    }
    
    .download-section {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 20px;
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      align-items: center;
      justify-content: center;
      margin-bottom: 25px;
      box-shadow: var(--shadow);
    }
    
    .download-section input {
      padding: 12px 15px;
      border-radius: 50px;
      border: 2px solid var(--primary);
      background: var(--editor-bg);
      color: var(--text);
      min-width: 250px;
      font-size: 1rem;
      transition: var(--transition);
    }
    
    .download-section input:focus {
      outline: none;
      border-color: var(--success);
    }
    
    .log-container {
      background: var(--card-bg);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow-md);
      margin-bottom: 25px;
      transition: var(--transition);
    }
    
    .log-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(0, 0, 0, 0.1);
      padding: 15px;
      border-bottom: 1px solid var(--border-color);
    }
    
    .log-title {
      font-size: 1.2rem;
      font-weight: 600;
    }
    
    .log-count {
      background: var(--danger);
      color: white;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 0.9rem;
    }
    
    .log-content {
      height: 200px;
      overflow-y: auto;
      padding: 15px;
      background: var(--log-bg);
      color: var(--log-text);
      transition: var(--transition);
    }
    
    .log-entry {
      padding: 10px;
      margin-bottom: 10px;
      border-radius: 5px;
      background: rgba(231, 76, 60, 0.15);
      border-left: 3px solid var(--danger);
      font-family: 'Fira Code', 'Consolas', monospace;
      font-size: 14px;
      color: var(--danger);
    }
    
    .log-entry:last-child {
      margin-bottom: 0;
    }
    
    .log-entry.success {
      background: rgba(16, 185, 129, 0.15);
      border-left: 3px solid var(--success);
      color: var(--success);
    }
    
    .log-entry.warning {
      background: rgba(243, 156, 18, 0.15);
      border-left: 3px solid var(--warning);
      color: var(--warning);
    }
    
    /* Syntax Highlighting */
    .selector {
      color: #f472b6;
    }
    
    .property {
      color: #38bdf8;
    }
    
    .value {
      color: #10b981;
    }
    
    .brace {
      color: #f59e0b;
    }
    
    .error {
      background: rgba(231, 76, 60, 0.2);
      color: #ff9e9e;
      border-left: 2px solid var(--danger);
    }
    
    .comment {
      color: #94a3b8;
    }
    
    .at-rule {
      color: #a78bfa;
    }
    
    .variable {
      color: #ec4899;
    }
    
    .autocomplete-container {
      position: absolute;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      max-height: 200px;
      overflow-y: auto;
      z-index: 100;
      box-shadow: var(--shadow-md);
      display: none;
    }
    
    .autocomplete-item {
      padding: 8px 15px;
      cursor: pointer;
      transition: background 0.2s;
    }
    
    .autocomplete-item:hover {
      background: rgba(67, 97, 238, 0.1);
    }
    
    .autocomplete-item.active {
      background: rgba(67, 97, 238, 0.2);
    }
    
    .settings-panel {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 20px;
      margin-bottom: 25px;
      box-shadow: var(--shadow-md);
      transition: var(--transition);
    }
    
    .settings-title {
      font-size: 1.3rem;
      margin-bottom: 15px;
      color: var(--primary);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    
    .settings-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
    }
    
    .setting-item {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    
    .setting-item label {
      font-weight: 500;
      color: var(--gray);
    }
    
    .setting-item input, .setting-item select {
      padding: 10px 15px;
      border-radius: var(--radius);
      border: 1px solid var(--border-color);
      background: var(--editor-bg);
      color: var(--text);
      font-family: inherit;
    }
    
    .setting-item input:focus, .setting-item select:focus {
      outline: none;
      border-color: var(--primary);
    }
    
    @media (max-width: 768px) {
      .panel {
        flex-direction: column;
      }
      
      .editor-container {
        width: 100%;
      }
      
      .controls {
        flex-direction: column;
        align-items: center;
      }
      
      .btn {
        width: 100%;
        justify-content: center;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="theme-toggle" id="theme-toggle">
        <i class="fas fa-moon"></i>
        <span>Dark Mode</span>
      </div>
      <div class="header-content">
        <h1>FSCSS Compiler v2.0</h1>
        <p class="subtitle">Enhanced with Dark Mode, Autocomplete & Advanced Features</p>
      </div>
    </header>
    
    <div class="settings-panel">
      <h2 class="settings-title"><i class="fas fa-cog"></i> Compiler Settings</h2>
      <div class="settings-grid">
        <div class="setting-item">
          <label for="font-size">Editor Font Size</label>
          <select id="font-size">
            <option value="12">12px</option>
            <option value="14" selected>14px</option>
            <option value="16">16px</option>
            <option value="18">18px</option>
          </select>
        </div>
        <div class="setting-item">
          <label for="tab-size">Tab Size</label>
          <select id="tab-size">
            <option value="2" selected>2 spaces</option>
            <option value="4">4 spaces</option>
          </select>
        </div>
        <div class="setting-item">
          <label for="auto-complete">Autocomplete</label>
          <select id="auto-complete">
            <option value="on" selected>Enabled</option>
            <option value="off">Disabled</option>
          </select>
        </div>
        <div class="setting-item">
          <label for="error-reporting">Error Reporting</label>
          <select id="error-reporting">
            <option value="verbose" selected>Verbose</option>
            <option value="minimal">Minimal</option>
          </select>
        </div>
      </div>
    </div>
    
    <div class="panel">
      <div class="editor-container">
        <div class="panel-header">
          <span>FSCSS Input</span>
          <div>
            <button class="btn btn-secondary" id="upload-btn">
              <i class="fas fa-upload"></i> Upload
            </button>
            <input type="file" hidden id="upload" accept=".fscss, text/*">
          </div>
        </div>
        <textarea class="editor-box" id="fscssBox" placeholder="Enter your FSCSS code here...">
$primary-color: @random([midnightblue, #0310031, #002255]);
$main-background: #000044;

str(main style, "
  background: $main-background!;
  color: #dddddd;
  font-size: 15pt;
  border-style: groove;
")

body {
  main style;
  border: 0;
} 

div {
  main style;
  %2(width, height[:50px;])
  border-color: #300030 copy(4, var-color);
  border-width: num(10 / 5)px;
  color: $primary-color!;
} 

div.grid {
  %4(max-width, max-height, width, height[: 200px;])
  outline: 4px double $var-color!;
}
        </textarea>
        <div id="autocomplete" class="autocomplete-container"></div>
      </div>
      
      <div class="editor-container output-container">
        <div class="panel-header">
          <span>CSS Output</span>
          <button class="btn" id="copy-btn">
            <i class="fas fa-copy"></i> Copy
          </button>
        </div>
        <pre class="editor-box" id="cssBox"><code>Compiled CSS will appear here...</code></pre>
      </div>
    </div>
    
    <div class="controls">
      <button class="btn btn-success" id="run">
        <i class="fas fa-play"></i> Compile FSCSS
      </button>
      <button class="btn btn-secondary" id="format-btn">
        <i class="fas fa-indent"></i> Format Code
      </button>
      <button class="btn" id="save-btn">
        <i class="fas fa-save"></i> Save Session
      </button>
      <button class="btn btn-danger" id="clear-log-btn">
        <i class="fas fa-trash"></i> Clear Log
      </button>
    </div>
    
    <div class="download-section">
      <input type="text" id="fileName" value="stylesheet" placeholder="Enter file name...">
      <button class="btn btn-success" id="download">
        <i class="fas fa-download"></i> Download CSS
      </button>
      <button class="btn" id="download-fscss">
        <i class="fas fa-file-code"></i> Download FSCSS
      </button>
    </div>
    
    <div class="log-container">
      <div class="log-header">
        <div class="log-title">Compilation Log</div>
        <div class="log-count">Errors: <span id="error-count">0</span></div>
      </div>
      <div class="log-content" id="log-container">
        <div class="log-entry success">Compiler ready. Press "Compile FSCSS" to start.</div>
      </div>
    </div>
  </div>

  <script src="scripts/r2compile.js" async></script>
</body>
</html>
