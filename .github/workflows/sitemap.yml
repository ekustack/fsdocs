name: Auto Generate Sitemap

on:
  push:
    branches: [main]

jobs:
  sitemap:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repo
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # IMPORTANT for lastmod

      # 2. Generate sitemap
      - name: Generate sitemap.xml
        id: sitemap
        uses: cicirello/generate-sitemap@v1
        with:
          base-url-path: https://fscss.devtem.org
          include-html: true
          drop-html-extension: true   # removes .html → /docs
          exclude-paths: |
            assets
            scripts
            node_modules

      # 3. Commit & push sitemap
      - name: Commit sitemap
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add sitemap.xml
          git diff --cached --quiet || git commit -m "Auto update sitemap"
          git push
