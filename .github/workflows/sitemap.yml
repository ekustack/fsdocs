name: Auto Generate Sitemap

on:
  push:
    branches: [main]

jobs:
  sitemap:
    runs-on: ubuntu-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true  # 🔥 opt-in now

    steps:
      # 1. Checkout 
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Generate sitemap
      - name: Generate sitemap.xml
        uses: cicirello/generate-sitemap@v1
        with:
          base-url-path: https://fscss.devtem.org
          include-html: true
          drop-html-extension: true
          exclude-paths: |
            assets
            scripts
            node_modules

      # 3. Commit changes
      - name: Commit sitemap
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add sitemap.xml
          git diff --cached --quiet || git commit -m "🤖 Auto update sitemap"
          git push
